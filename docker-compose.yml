version: '3.8'

services:
  # Redis - Cache & Job Broker (PostgreSQL is strictly provided by Supabase)
  redis:
    image: redis:7-alpine
    container_name: sales_crm_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Backend - FastAPI Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_crm_backend
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - MOCK_EXTERNAL_SERVICES=${MOCK_EXTERNAL_SERVICES:-true}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Background Worker - RQ Worker executing LangGraph pipelines
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_crm_worker
    command: python -m app.worker.worker
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - MOCK_EXTERNAL_SERVICES=${MOCK_EXTERNAL_SERVICES:-true}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend - Next.js Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales_crm_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  # n8n - Workflow Automation Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: sales_crm_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infrastructure/n8n/workflows:/data/workflows
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  n8n_data:
